name: C/C++ CI

on:
  push:
    branches: [ "main", "Lab4" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: pathtofolder
      run: cd ./Lab3/ 
    - name: make clean
      run: make clean
    - name: make
      run: make
