name: C/C++ CI

on:
  push:
    branches: [ "main", "Lab4" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: pathtofolder
      run: | 
           cd ./Lab3/ 
           make clean
           make

